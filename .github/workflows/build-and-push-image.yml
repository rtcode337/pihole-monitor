# Dockerイメージをビルドして GHCR(ghcr.io)へ公開するワークフロー。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす前提。
# ビルドするのは linux/amd64 のみ(非公開リポジトリではActions実行時間もGHCRの
# ストレージもプランの無料枠を消費する。arm64のネイティブランナーは公開リポジトリ
# でないと無料枠で使えず、QEMUエミュレーションでのビルドは cargo build /
# npm install が極端に遅くなるため作らない)。
#
# arm64が必要になったら、QEMUではなくRustのクロスコンパイル
# (`--target aarch64-unknown-linux-gnu`)でamd64ランナーからバイナリを作る方が速い。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらないため、実行時間を使わない
    paths-ignore:
      - "**.md"
      - ".gitignore"
  # 手動実行(Actionsタブの "Run workflow")
  workflow_dispatch:

# 同じrefへの連続pushでは古い実行を打ち切る(無料枠の節約)
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCRへのpushに必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCRにログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … mainへのpush時(デプロイ先が通常追いかけるタグ)
      #   sha-<短縮SHA> … 毎回付ける固定タグ(どのコミットが動いているか後から特定できる)
      #                   ただし**残るのは最新の 1 版だけ**(下の削除ステップ参照)
      #   v1.2.3        … `v*` タグをpushした場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドしてpush
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 単一アーキテクチャなので attestation(provenance/sbom)は付けない
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依存クレートのビルド(Dockerfileの空main.rsのレイヤー)と
          # npm install -g @anthropic-ai/claude-code のレイヤーを実行間で使い回す。
          # Cargo.toml / Cargo.lock を変えなければ、毎回のビルドは自前のクレートだけになる
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 古いイメージを消して最新の 1 つだけ残す。
      #
      # GHCR のストレージ枠は**アカウント全体で共有**（非公開リポジトリで 500MB。
      # Actions の artifact とも共用）。超えても課金にはならず、支払い方法が無い場合は
      # **push そのものがブロックされる**（次の月初まで）。
      # `latest` を付け替えても前の版は `sha-` タグ付きで残り続けるため、
      # 放っておくと push のたびに積み上がってその状態に近づく。
      #
      # **ロールバック用の版も消える。** タグを指定して古い版に戻す運用はできなくなるので、
      # 1 世代前を残したくなったら min-versions-to-keep を 2 に上げる。
      #
      # **失敗しても握りつぶさない**（continue-on-error を付けない）。消せていないのに
      # 成功に見えると、枠が埋まって push が止まる日まで気づけないため。
      # GITHUB_TOKEN で権限が足りない場合は、delete:packages + read:packages を持つ PAT を
      # シークレット GHCR_CLEANUP_TOKEN に入れれば、そちらが使われる。
      - name: 古いイメージを削除して最新版だけ残す
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 1
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
