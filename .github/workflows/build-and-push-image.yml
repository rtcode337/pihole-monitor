# Dockerイメージをビルドして GHCR(ghcr.io)へ公開するワークフロー。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす前提。
# 出すのは linux/amd64 と linux/arm64(arm系のNASやRaspberry Piでも動かせるように)。
#
# 重い部分はエミュレーションしない。Rustはクロスコンパイル(Dockerfileのbuilderステージが
# BUILDPLATFORMで走り、--target で対象アーキのバイナリを出す)、Claude CodeのCLIは
# 対象アーキのパッケージを取り出すだけ。QEMUが要るのは実行ステージの apt-get だけで、
# 入れるのは3パッケージなので数十秒で済む。
#
# 公開リポジトリなので、標準ランナーの実行時間も公開パッケージのストレージも無料。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらないため、実行時間を使わない
    paths-ignore:
      - "**.md"
      - ".gitignore"
  # 手動実行(Actionsタブの "Run workflow")
  workflow_dispatch:

# 同じrefへの連続pushでは古い実行を打ち切る(後から出た結果だけが要るため)
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCRへのpushに必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      # 実行ステージの apt-get を arm64 で走らせるために要る(ビルド本体はクロスなので、
      # ここでエミュレーションするのは3パッケージのインストールだけ)
      - name: QEMUをセットアップ
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCRにログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … mainへのpush時(デプロイ先が通常追いかけるタグ)
      #   sha-<短縮SHA> … 毎回付ける固定タグ(どのコミットが動いているか後から特定できる)
      #                   ただし残るのは直近の1回ぶんだけ(下の削除ステップ参照)
      #   v1.2.3        … `v*` タグをpushした場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドしてpush
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # attestation(provenance/sbom)は付けない —— タグの下に別のマニフェストが増え、
          # GHCRの一覧で「どれが本体か」が読みにくくなる
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 依存クレートのビルド(Dockerfileの空main.rsのレイヤー)を実行間で使い回す。
          # Cargo.toml / Cargo.lock を変えなければ、毎回のビルドは自前のクレートだけになる。
          # アーキごとに別のキャッシュとして載る
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 古いイメージを消して直近の1回ぶんだけ残す。
      #
      # `latest` を付け替えても前の版は `sha-` タグ付きで残り続けるため、放っておくと
      # push のたびに積み上がる。公開パッケージなのでストレージは無料だが、版が積み上がると
      # 一覧が読めなくなり、どれが生きているか分からなくなる。
      #
      # 残す数が3なのはマルチアーキだから。1回のpushで
      # 「マニフェストリスト(タグが付く) + amd64 + arm64(どちらもタグ無し)」の3版ができ、
      # 3未満にすると今のイメージの中身まで消えてpullが壊れる。
      # 1世代前も残したいなら6に上げる(3版 × 2世代)。
      #
      # 失敗しても握りつぶさない(continue-on-error を付けない)。消せていないのに
      # 成功に見えると、積み上がりに気づけないため。
      # GITHUB_TOKEN で権限が足りない場合は、delete:packages + read:packages を持つ PAT を
      # シークレット GHCR_CLEANUP_TOKEN に入れれば、そちらが使われる。
      - name: 古いイメージを削除して最新版だけ残す
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
