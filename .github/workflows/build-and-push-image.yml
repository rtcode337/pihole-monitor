# Dockerイメージをビルドして GHCR(ghcr.io)へ公開するワークフロー。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす前提。
# ビルドするのは linux/amd64 のみ(非公開リポジトリではActions実行時間もGHCRの
# ストレージもプランの無料枠を消費する。arm64のネイティブランナーは公開リポジトリ
# でないと無料枠で使えず、QEMUエミュレーションでのビルドは pip install /
# npm install が極端に遅くなるため作らない)。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらないため、実行時間を使わない
    paths-ignore:
      - "**.md"
      - ".gitignore"
  # 手動実行(Actionsタブの "Run workflow")
  workflow_dispatch:

# 同じrefへの連続pushでは古い実行を打ち切る(無料枠の節約)
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCRへのpushに必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCRにログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … mainへのpush時(デプロイ先が通常追いかけるタグ)
      #   sha-<短縮SHA> … 毎回付ける固定タグ(どのコミットが動いているか後から特定できる)
      #   v1.2.3        … `v*` タグをpushした場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドしてpush
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 単一アーキテクチャなので attestation(provenance/sbom)は付けない
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # pip install / npm install -g @anthropic-ai/claude-code のレイヤーを
          # 実行間で使い回す
          cache-from: type=gha
          cache-to: type=gha,mode=max
