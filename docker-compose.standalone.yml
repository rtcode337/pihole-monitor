# `.env` を置けず、リポジトリのクローンもできない実行環境向けの単体定義。
# (NASのコンテナマネージャー等、管理画面にYAMLを貼り付けて起動するタイプの環境を想定)
#
# docker-compose.yml との違いは3点だけ:
#   1. `${...}`・`env_file` を使わず、値をYAMLに直接書く(`.env`もシェルの環境変数も
#      無い前提のため)
#   2. `build: .` を持たない(ソースが手元に無いので、GHCRのイメージをpullするだけ)
#   3. bindマウントを相対パス(./data)ではなく絶対パスで書く
#      (管理画面から登録する環境では相対パスの基準が分かりにくいため)
#
# 使い方:
#   1. 「ここだけ編集」の置き場とPi-holeの接続先を、その環境の値に書き換える
#   2. その内容を管理画面に貼り付けて起動する
#   3. http://<ホスト>:6001/ を開く
#
# 非公開リポジトリのためGHCRのパッケージも非公開。pullする前に、そのホストで
# `read:packages` スコープのPersonal Access Tokenを使って
# `docker login ghcr.io -u <GitHubユーザー名>` を済ませておくこと。
#
# 障害時は :latest ではなく :sha-xxxxxxx を指定すれば任意の時点のイメージに戻せる。
#
# 通常の(リポジトリを配置できる)環境では docker-compose.yml を使う
# ——こちらは値の直書きぶん古くなりやすい。

# ---- ここだけ編集: データの置き場(ホストの絶対パス) ----
# SQLite(monitor.db)と、CLIブリッジと共有する設定(state/settings.db)が入る。
# 消すと確認済みの仕分けとトークンが失われる。無ければDockerが自動作成するが、
# 先に作っておくのが確実。所有者合わせは起動時に pihole-monitor-init がやるので、
# `chown` を手で打つ必要はない。
x-data-dir: &data-dir "/path/to/pihole-monitor/data"

# ---- ここだけ編集: 上の置き場の下の state ディレクトリ ----
# CLIブリッジと共有する設定(settings.db)の置き場。**上の値 + /state** を書く
# (YAMLのアンカーは文字列の一部に差し込めないため2行に分けてある)。
# 中身は本体が書き、ブリッジは読み取り専用で読む
x-state-dir: &state-dir "/path/to/pihole-monitor/data/state"

# ---- ここだけ編集: 実行ユーザー ----
# ホスト側でこのディレクトリを読み書きするユーザーの `id -u`:`id -g`。
# ここが合っていないとデータディレクトリに書けず起動に失敗する
# (ログに「DBを開けない」と出る)。イメージ内の既定は 1000:1000
x-run-as: &run-as "1000:1000"

# ---- ここだけ編集: Pi-holeへの接続とアプリの設定(.env の代わり) ----
x-app-env: &app-env
  # Pi-hole(v6)のURL。例: http://192.168.1.x:80(.env.exampleと同じ書式)
  PIHOLE_BASE_URL: "http://pihole:80"
  # Pi-holeの管理パスワード
  PIHOLE_PASSWORD: ""
  # 取得するブロッククエリの件数(-1で全件)
  PIHOLE_QUERY_LIMIT: "-1"
  # 「Claudeに聞く」1回あたりのタイムアウト秒数
  CLAUDE_TIMEOUT: "60"
  # CLIを動かすサイドカー。ホストへは公開していないのでサービス名で呼ぶ
  CLAUDE_BRIDGE_URL: "http://bridge:7013/v1"

services:
  # 本体を起動する前にデータディレクトリの所有者を実行ユーザーに合わせる。
  # マウント先がホストに無いとroot所有で作られ、非rootの本体が書けずに落ちるため。
  # $$0 は sh に渡す位置パラメータ(composeが $ をエスケープする書き方)。
  # これで chown 先と下の user: が同じ値を参照でき、片方だけ直す事故を防げる
  pihole-monitor-init:
    image: ghcr.io/rtcode337/pihole-monitor:latest
    container_name: pihole-monitor-init
    user: root
    volumes:
      - type: bind
        source: *data-dir
        target: /data
    entrypoint: ["sh", "-c", 'mkdir -p /data/state && chown -R "$$0" /data', *run-as]
    restart: "no"

  pihole-monitor:
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    image: ghcr.io/rtcode337/pihole-monitor:latest
    container_name: pihole-monitor
    environment: *app-env
    ports:
      # host:container。6000はブラウザが「安全でないポート」として拒否する
      # (X11用の予約。ERR_UNSAFE_PORT)ため使えないので6001にしている。
      # LAN内からのみ見える状態にしておくこと
      - "6001:6001"
    volumes:
      - type: bind
        source: *data-dir
        target: /data
    user: *run-as
    restart: unless-stopped

  # 「Claudeに聞く」で使うCLIを動かすサイドカー(chiezoリポジトリの**公開**イメージ。
  # これだけは docker login 無しでpullできる)。**本体はCLIを持たない**。
  # **ホストへポートを公開しない** —— 認証が無いうえにトークンを読めるため。
  # 認証情報は state/settings.db 経由で渡す(画面から入れたトークンを本体が書く)
  bridge:
    image: ghcr.io/rtcode337/chiezo-bridge:latest
    container_name: pihole-monitor-bridge
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    volumes:
      # **読み取り専用**。ブリッジは書かない
      - type: bind
        source: *state-dir
        target: /state
        read_only: true
    environment:
      CHIEZO_BRIDGE_CLI: "claude"
      # MCPは繋がない(渡すのは自前のプロンプトのため)
      CHIEZO_BRIDGE_MCP_URL: ""
      CHIEZO_BRIDGE_TIMEOUT: "60"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
      interval: 60s
