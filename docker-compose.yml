# イメージはGitHub Actionsがmainへのpushでビルドし、GHCRへ公開する
# (.github/workflows/build-and-push-image.yml 参照)。デプロイ先ではビルドせず
# pullするだけでよい:
#
#   docker compose pull && docker compose up -d
#
# パッケージは公開なので、pullに認証は要らない。
#
# `.env` に PIHOLE_MONITOR_IMAGE=ghcr.io/rtcode337/pihole-monitor:sha-xxxxxxx を書けば
# 特定のイメージを指定できる。
# ※ GHCR には最新の 1 版しか残らない（push のたびに古い版を消してストレージの
#   無料枠を守っている。.github/workflows/build-and-push-image.yml）ので、
#   過去のイメージへは戻せない。戻せるようにするなら、あちらの
#   min-versions-to-keep を上げて残す世代を増やすこと。
# `build: .` は手元のソースから作り直したいとき用に残してある(`docker compose build`)。
#
# `.env` もリポジトリも置けない環境(NASのコンテナマネージャー等)向けには
# docker-compose.standalone.example.yml を用意している(雛形。実値を入れたものは
# .gitignore してあるので、コピーして作る)。
services:
  # 本体を起動する前に data/ の所有者を実行ユーザーに合わせる。
  # bindマウント先がホストに無いとDockerがroot所有で作ってしまい、非rootの本体が
  # 書けずに落ちる(「DBを開けない」)。rootで動いていた頃のデータを引き継ぐ場合や、
  # バックアップから別の所有者で復元したときも、ここで揃うので手作業が要らない。
  # 本体と同じイメージ・同じタグなので、pullもビルドも増えない(2つ目はキャッシュに当たる)
  pihole-monitor-init:
    image: ${PIHOLE_MONITOR_IMAGE:-ghcr.io/rtcode337/pihole-monitor:latest}
    build: .
    container_name: pihole-monitor-init
    user: root
    volumes:
      - ./data:/data
    # state/ にはトークンの設定DBとClaude CodeのCLIのホームが入る。
    # 先に作っておかないと、非rootの本体が作れずにトークンを保存できない
    entrypoint: ["sh", "-c", "mkdir -p /data/state && chown -R ${PIHOLE_MONITOR_UID:-10001}:${PIHOLE_MONITOR_GID:-10001} /data"]
    restart: "no"

  # 「AIに聞く」はこのコンテナが同梱のClaude CodeのCLIを起動する。
  # トークンは画面から入れると data/state/settings.db に保存される。
  #
  # Chiezo(LAN内の知識サーバー)越しに他のAIも選べる。接続先は .env の CHIEZO_BASE_URL。
  # 同じホストでChiezoが動いているのに届かないときは、コンテナからホストの公開ポートへ
  # 戻る経路が塞がれている可能性がある(NASのファイアウォール等)。その場合はChiezoの
  # ネットワークに相乗りしてサービス名で呼ぶ —— やることは下の networks: と
  # ファイル末尾の networks: のコメントを外し、CHIEZO_BASE_URL を
  # http://chiezo-app:7010 にするだけ(chiezo-app はコンテナ名なので、相手の
  # プロジェクト名が何でもこの名前で引ける)。
  # `networks:` を書くと既定のネットワークに自動で入らなくなる —— `default` を
  # 並べ忘れると、Pi-hole など外への通信ごと届かなくなる

  pihole-monitor:
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    image: ${PIHOLE_MONITOR_IMAGE:-ghcr.io/rtcode337/pihole-monitor:latest}
    build: .
    container_name: pihole-monitor
    ports:
      - "7060:7060"
    env_file:
      - .env
    volumes:
      # 所有者は pihole-monitor-init が起動前に揃える
      - ./data:/data
    # 実行ユーザー。**イメージ内の既定は uid/gid 10001** —— ホストに実在しない番号に
    # しておくと、万一コンテナから抜け出されてもホストのユーザーのファイルには届かない。
    # そのぶん data/ の中身はホストから見て「知らないユーザー」の持ち物になるので、
    # 手元で直接編集・書き戻しをしたいホストでは `.env` の
    # PIHOLE_MONITOR_UID / PIHOLE_MONITOR_GID に `id -u` / `id -g` を入れる
    user: "${PIHOLE_MONITOR_UID:-10001}:${PIHOLE_MONITOR_GID:-10001}"
    # Chiezoがホストの公開ポート経由で届かないときだけ、次の1行と
    # ファイル末尾の networks: を有効にする(default も必ず並べる)
    #networks: [default, chiezo]
    restart: unless-stopped

# Chiezoのネットワークに相乗りするときだけ有効にする(上の pihole-monitor の
# networks: と対で使う)。`external: true` はそのネットワークが既に在ることが前提なので、
# Chiezoを同じホストで動かしていない環境で有効にすると本体が起動できなくなる。
# name は環境で変わる(`<プロジェクト名>_default`)ので docker network ls で確かめること
#networks:
#  chiezo:
#    external: true
#    name: chiezo_default
