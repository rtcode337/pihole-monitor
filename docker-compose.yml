# イメージはGitHub Actionsがmainへのpushでビルドし、GHCRへ公開する
# (.github/workflows/build-and-push-image.yml 参照)。デプロイ先ではビルドせず
# pullするだけでよい:
#
#   docker compose pull && docker compose up -d
#
# 非公開リポジトリのためGHCRのパッケージも非公開。事前にそのホストで
# `docker login ghcr.io`(read:packages 権限のPAT)が必要。README参照。
#
# `.env` に PIHOLE_MONITOR_IMAGE=ghcr.io/rtcode337/pihole-monitor:sha-xxxxxxx を書けば
# 特定のイメージを指定できる。
# ※ GHCR には**最新の 1 版しか残らない**（push のたびに古い版を消してストレージの
#   無料枠を守っている。.github/workflows/build-and-push-image.yml）ので、
#   過去のイメージへは戻せない。戻せるようにするなら、あちらの
#   min-versions-to-keep を上げて残す世代を増やすこと。
# `build: .` は手元のソースから作り直したいとき用に残してある(`docker compose build`)。
#
# `.env` もリポジトリも置けない環境(NASのコンテナマネージャー等)向けには
# docker-compose.standalone.yml を用意している。
services:
  # 本体を起動する前に data/ の所有者を実行ユーザーに合わせる。
  # bindマウント先がホストに無いとDockerがroot所有で作ってしまい、非rootの本体が
  # 書けずに落ちる(「DBを開けない」)。rootで動いていた頃のデータを引き継ぐ場合や、
  # バックアップから別の所有者で復元したときも、ここで揃うので手作業が要らない。
  # 本体と同じイメージ・同じタグなので、pullもビルドも増えない(2つ目はキャッシュに当たる)
  pihole-monitor-init:
    image: ${PIHOLE_MONITOR_IMAGE:-ghcr.io/rtcode337/pihole-monitor:latest}
    build: .
    container_name: pihole-monitor-init
    user: root
    volumes:
      - ./data:/data
    # state/ はCLIブリッジと共有する(bridgeが読み取り専用でマウントする)。
    # ここで先に作っておかないと、bridgeのマウントでDockerがroot所有で作ってしまう
    entrypoint: ["sh", "-c", "mkdir -p /data/state && chown -R ${PIHOLE_MONITOR_UID:-1000}:${PIHOLE_MONITOR_GID:-1000} /data"]
    restart: "no"

  # 「AIに聞く」でChiezo(LAN内の知識サーバー)を使うときの経路については
  # .env の CHIEZO_BASE_URL を参照。**同じホストでChiezoが動いているのに届かないとき**は、
  # コンテナからホストの公開ポートへ戻る経路が塞がれている可能性がある(NASのファイアウォール等)。
  # その場合はChiezoのネットワークに相乗りしてサービス名で呼ぶ:
  #
  #   services:
  #     pihole-monitor:
  #       networks: [default, chiezo]   # ← **default も必ず並べる**
  #   networks:
  #     chiezo:
  #       external: true
  #       name: chiezo_default          # ← chiezo 側の実際のネットワーク名(docker network ls で確認)
  #
  # そのうえで CHIEZO_BASE_URL を http://chiezo-api:7010 にする。
  # **`networks:` を書くと既定のネットワークに自動で入らなくなる** —— `default` を並べ忘れると
  # bridge にも繋がらなくなる(「AIに聞く」がどちらの経路でも動かなくなる)

  pihole-monitor:
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    image: ${PIHOLE_MONITOR_IMAGE:-ghcr.io/rtcode337/pihole-monitor:latest}
    build: .
    container_name: pihole-monitor
    ports:
      # host:container。**7000番台に10刻みで割り当てる運用**の pihole-monitor 枠。
      # 6000番台は使わない —— 6000はX11用の予約で、ブラウザが「安全でないポート」として
      # 拒否する(ERR_UNSAFE_PORT)
      - "7060:7060"
    env_file:
      - .env
    volumes:
      # 所有者は pihole-monitor-init が起動前に揃える
      - ./data:/data
    # data/ に書かれるファイルをホストのユーザー所有にする。イメージ内の既定は
    # uid/gid 1000(nodeユーザー)。`id -u` が1000以外のホストでは
    # `.env` の PIHOLE_MONITOR_UID / PIHOLE_MONITOR_GID で合わせる
    user: "${PIHOLE_MONITOR_UID:-1000}:${PIHOLE_MONITOR_GID:-1000}"
    restart: unless-stopped

  # 「AIに聞く」でCLIブリッジを使うときのサイドカー(chiezoリポジトリのイメージ)。
  # **本体はCLIを持たない** —— イメージから150MB近くを外せる。
  #
  # **ホストへポートを公開しない。** 認証が無いうえにトークンを読めるので、
  # 外から触れるとそのままAIを使われる。呼ぶのは同じcomposeネットワークの本体だけ。
  #
  # 認証情報は data/state/settings.db 経由で渡す(画面から入れたトークンを本体が書く)。
  # MCPは繋がない —— 渡すのは自前のプロンプトで、知識ベースを引かせる用途ではない
  bridge:
    # **公開パッケージ**なので docker login は要らない(本体のイメージだけが非公開)
    image: ${BRIDGE_IMAGE:-ghcr.io/rtcode337/chiezo-bridge:latest}
    container_name: pihole-monitor-bridge
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    volumes:
      # **読み取り専用**。ブリッジは書かない
      - ./data/state:/state:ro
    environment:
      - CHIEZO_BRIDGE_CLI=claude
      - CHIEZO_BRIDGE_MCP_URL=
      # 1回の上限は要求ごとに送るので、ここは保険の既定値(CLAUDE_TIMEOUT と同じ値にする)
      - CHIEZO_BRIDGE_TIMEOUT=${CLAUDE_TIMEOUT:-60}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
      interval: 60s
