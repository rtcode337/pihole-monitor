<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi-hole Monitor</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-title" content="Pi-hole Mon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
// 選んだテーマを**描画の前**に当てる。body の側で当てると、一瞬もう一方の色が出てしまう
// （app.js は末尾で読み込まれるため）。保存が無ければ data-theme を付けず、OS の設定に従う
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) { /* localStorage が使えない環境ではOSの設定に従う */ }
})();
</script>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
  <div class="logo"></div>
  <h1>Pi-hole <span>Monitor</span></h1>
  <!-- 中身（太陽/月）は app.js が入れる。押すと切り替わる先の印を出す -->
  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="テーマを切り替える"></button>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-value alert" id="stat-new">-</div>
    <div class="stat-label">未確認</div>
  </div>
  <div class="stat">
    <div class="stat-value ok" id="stat-reviewed">-</div>
    <div class="stat-label">確認済み</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-total">-</div>
    <div class="stat-label">ブロック総数</div>
  </div>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('new', event)">未確認のみ</button>
  <button class="filter-btn" onclick="setFilter('reviewed', event)">確認済みのみ</button>
  <button class="filter-btn" onclick="setFilter('all', event)">すべて</button>
  <!-- いま聞く相手の名前をそのままボタンにする。「どのAIが答えるのか」を
       押す前に知りたいので、名前を隠して歯車だけにはしない -->
  <button class="bulk-btn" onclick="openBulkModal()" title="いま一覧に出ているドメインをまとめてAIに聞き、結果をメモとして残す">まとめてAIに聞く</button>
  <button class="ai-btn" id="ai-btn" onclick="openAiModal()" title="ドメインについて聞くAIを選ぶ">AI: -</button>
  <button class="refresh-btn" onclick="loadDomains()">更新</button>
</div>

<div class="domain-list" id="domain-list">
  <div class="loading">読み込み中...</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal" style="display:none" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">メモ</div>
    <div class="modal-domain" id="modal-domain"></div>
    <textarea id="modal-note" class="modal-note" placeholder="メモ（確認済みにしなくても残せます）"></textarea>
    <div class="modal-actions">
      <button class="action-btn cancel-btn" onclick="closeModal()">キャンセル</button>
      <!-- メモだけ残すのと、確認済みにするのは別の操作。
           確認済みのドメインには「確認済みにする」を出さない（app.js が隠す） -->
      <button class="action-btn review-btn" onclick="submitNote()">メモを保存</button>
      <button class="action-btn confirm-btn" id="modal-review-btn" onclick="submitReview()">確認済みにする</button>
    </div>
  </div>
</div>

<!-- まとめてAIに聞く。対象と進捗はJSが組む -->
<div class="modal-overlay" id="bulk-modal" style="display:none" onclick="onBulkOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">まとめてAIに聞く</div>
    <div class="bulk-note" id="bulk-note"></div>
    <div class="bulk-log" id="bulk-log"></div>
    <div class="modal-actions">
      <button class="action-btn cancel-btn" id="bulk-close-btn" onclick="closeBulkModal()">閉じる</button>
      <button class="action-btn confirm-btn" id="bulk-run-btn" onclick="runBulkAsk()">実行</button>
    </div>
  </div>
</div>

<!-- 聞く相手を選ぶ。中身（相手・モデル・考える量）はChiezoに問い合わせてJSが組む -->
<div class="modal-overlay" id="ai-modal" style="display:none" onclick="onAiOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">聞く相手を選ぶ</div>
    <div class="ai-note" id="ai-note"></div>
    <div class="ai-list" id="ai-list"></div>
    <div class="modal-actions">
      <button class="action-btn cancel-btn" onclick="closeAiModal()">閉じる</button>
      <button class="action-btn confirm-btn" onclick="saveAiSelection()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="token-modal" style="display:none" onclick="onTokenOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">Claude認証が必要です</div>
    <div class="modal-body">
      トークンが未設定か、期限切れの可能性があります。<br>
      （Chiezo の相手を選んでいるときは不要です）<br><br>
      ブラウザやターミナルが使える端末で以下を実行し、表示されたトークンをそのまま貼り付けてください。<br><br>
      <code>claude setup-token</code>
    </div>
    <textarea id="token-input" class="modal-note" placeholder="ここにトークンを貼り付け"></textarea>
    <div class="modal-actions">
      <button class="action-btn cancel-btn" onclick="closeTokenModal()">キャンセル</button>
      <button class="action-btn confirm-btn" onclick="submitClaudeToken()">保存して実行</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
