# `.env` を置けず、リポジトリのクローンもできない実行環境向けの単体定義。
# (NASのコンテナマネージャー等、管理画面にYAMLを貼り付けて起動するタイプの環境を想定)
#
# docker-compose.yml との違いは3点だけ:
#   1. `${...}`・`env_file` を使わず、値をYAMLに直接書く(`.env`もシェルの環境変数も
#      無い前提のため)
#   2. `build: .` を持たない(ソースが手元に無いので、GHCRのイメージをpullするだけ)
#   3. bindマウントを相対パス(./data)ではなく絶対パスで書く
#      (管理画面から登録する環境では相対パスの基準が分かりにくいため)
#
# **これは雛形。** 実値を入れたものは .gitignore してあるので、手元でコピーして作る
# (この形式は値を直書きするので、追記した瞬間にPi-holeのパスワードがコミット対象に入る):
#
#   cp docker-compose.standalone.example.yml docker-compose.standalone.yml
#
# 使い方:
#   1. コピーした側の「ここだけ編集」——置き場とPi-holeの接続先——を、その環境の値に書き換える
#   2. その内容を管理画面に貼り付けて起動する
#   3. http://<ホスト>:7060/ を開く
#
# 非公開リポジトリのためGHCRのパッケージも非公開。pullする前に、そのホストで
# `read:packages` スコープのPersonal Access Tokenを使って
# `docker login ghcr.io -u <GitHubユーザー名>` を済ませておくこと。
#
# 障害時は :latest ではなく :sha-xxxxxxx を指定すれば任意の時点のイメージに戻せる。
#
# 通常の(リポジトリを配置できる)環境では docker-compose.yml を使う
# ——こちらは値の直書きぶん古くなりやすい。

# ---- ここだけ編集: データの置き場(ホストの絶対パス) ----
# SQLite(monitor.db)と、CLIブリッジと共有する設定(state/settings.db)が入る。
# 消すと確認済みの仕分けとトークンが失われる。無ければDockerが自動作成するが、
# 先に作っておくのが確実。所有者合わせは起動時に pihole-monitor-init がやるので、
# `chown` を手で打つ必要はない。
x-data-dir: &data-dir "/path/to/pihole-monitor/data"

# ---- ここだけ編集: 上の置き場の下の state ディレクトリ ----
# CLIブリッジと共有する設定(settings.db)の置き場。**上の値 + /state** を書く
# (YAMLのアンカーは文字列の一部に差し込めないため2行に分けてある)。
# 中身は本体が書き、ブリッジは読み取り専用で読む
x-state-dir: &state-dir "/path/to/pihole-monitor/data/state"

# ---- ここだけ編集: 実行ユーザー ----
# ホスト側でこのディレクトリを読み書きするユーザーの `id -u`:`id -g`。
# ここが合っていないとデータディレクトリに書けず起動に失敗する
# (ログに「DBを開けない」と出る)。イメージ内の既定は 1000:1000
x-run-as: &run-as "1000:1000"

# ---- ここだけ編集: Pi-holeへの接続とアプリの設定(.env の代わり) ----
x-app-env: &app-env
  # Pi-hole(v6)のURL。例: http://192.168.1.x:80(.env.exampleと同じ書式)
  PIHOLE_BASE_URL: "http://pihole:80"
  # Pi-holeの管理画面のURL。監視の一覧で「理由」を押すと、その通信だけを絞り込んだ
  # クエリログが開く。**開くのはブラウザ**なので、上がコンテナからしか引けない名前
  # (http://pihole:80 など)ならここにLANのIPを入れる。空なら上と同じものを使う
  PIHOLE_WEB_URL: ""
  # Pi-holeの管理パスワード
  PIHOLE_PASSWORD: ""
  # 取得するブロッククエリの件数(-1で全件)
  PIHOLE_QUERY_LIMIT: "-1"
  # 「AIに聞く」でCLIブリッジ(Claude Code)に頼むときの1回あたりのタイムアウト秒数
  CLAUDE_TIMEOUT: "60"
  # CLIを動かすサイドカー。ホストへは公開していないのでサービス名で呼ぶ
  CLAUDE_BRIDGE_URL: "http://bridge:7013/v1"
  # ---- ここだけ編集(任意): Chiezo(LAN内の知識サーバー)の**ルートURL** ----
  # 入れると、聞く相手(Claude Code / Codex / …)を画面から選べる。鍵はChiezoが持っている。
  # 使わないなら空文字("")——従来どおりCLIブリッジだけで動く。
  # **`/v1` は付けない**(こちらが `/v1/ai/...` を足すので、付けると404になる)。
  # 値は「**このコンテナから**Chiezoに届くアドレス」——別のホストならそのIP、
  # 同じホストならLANのIP(`localhost` はコンテナ自身を指すので不可)。
  # 届かないときは下の「同じホストでChiezoが動いているのに届かないとき」を見ること
  CHIEZO_BASE_URL: ""
  # Chiezo越しの1回の生成の上限(秒)。相手はCLIなので長めにしてある
  CHIEZO_TIMEOUT: "180"

# ---- 同じホストでChiezoが動いているのに届かないとき ----
# コンテナから**ホストの公開ポートへ戻る**経路は、環境によっては塞がれている
# (NASのファイアウォール等。症状は画面の「時間内に応答しなかった」)。
# **そのときはChiezoのネットワークに相乗りする**(ホストのポートを経由しない)。
# **やることは2か所のコメントを外し、上の CHIEZO_BASE_URL を
# "http://chiezo-api:7010" に書き換えるだけ**にしてある(外すのは下の
# pihole-monitor の `networks:` と、ファイル末尾の `networks:` の定義)。
# chiezo-api はコンテナ名なので、相手のプロジェクト名が何でもこの名前で引ける。
#
# 注意:
# - **`networks:` を書くと既定のネットワークに自動で入らなくなる。** `default` を並べ忘れると
#   bridge にも繋がらなくなり、「AIに聞く」がどちらの経路でも動かなくなる
# - **ネットワーク名は環境で変わる。** `<プロジェクト名>_default` で、プロジェクト名は
#   管理画面で付けたスタック名。`docker network ls` で実物を確認する
# - `external: true` は**そのネットワークが既に在ること**が前提。Chiezoを同じホストで
#   動かしていない環境でこれを書くと、本体が起動できなくなる(だから既定では外してある)

services:
  # 本体を起動する前にデータディレクトリの所有者を実行ユーザーに合わせる。
  # マウント先がホストに無いとroot所有で作られ、非rootの本体が書けずに落ちるため。
  # $$0 は sh に渡す位置パラメータ(composeが $ をエスケープする書き方)。
  # これで chown 先と下の user: が同じ値を参照でき、片方だけ直す事故を防げる
  pihole-monitor-init:
    image: ghcr.io/rtcode337/pihole-monitor:latest
    container_name: pihole-monitor-init
    user: root
    volumes:
      - type: bind
        source: *data-dir
        target: /data
    entrypoint: ["sh", "-c", 'mkdir -p /data/state && chown -R "$$0" /data', *run-as]
    restart: "no"

  pihole-monitor:
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    image: ghcr.io/rtcode337/pihole-monitor:latest
    container_name: pihole-monitor
    environment: *app-env
    ports:
      # host:container。**7000番台に10刻みで割り当てる運用**の pihole-monitor 枠。
      # 6000番台は使わない —— 6000はX11用の予約で、ブラウザが「安全でないポート」として
      # 拒否する(ERR_UNSAFE_PORT)。LAN内からのみ見える状態にしておくこと
      - "7060:7060"
    volumes:
      - type: bind
        source: *data-dir
        target: /data
    user: *run-as
    # Chiezoがホストの公開ポート経由で届かないときだけ、次の1行と
    # ファイル末尾の networks: を有効にする(**default も必ず並べる**)
    #networks: [default, chiezo]
    restart: unless-stopped

  # 「AIに聞く」でCLIブリッジを使うときのサイドカー(chiezoリポジトリの**公開**イメージ。
  # これだけは docker login 無しでpullできる)。**本体はCLIを持たない**。
  # **ホストへポートを公開しない** —— 認証が無いうえにトークンを読めるため。
  # 認証情報は state/settings.db 経由で渡す(画面から入れたトークンを本体が書く)
  bridge:
    image: ghcr.io/rtcode337/chiezo-bridge:latest
    container_name: pihole-monitor-bridge
    depends_on:
      pihole-monitor-init:
        condition: service_completed_successfully
    volumes:
      # **読み取り専用**。ブリッジは書かない
      - type: bind
        source: *state-dir
        target: /state
        read_only: true
    environment:
      CHIEZO_BRIDGE_CLI: "claude"
      # MCPは繋がない(渡すのは自前のプロンプトのため)
      CHIEZO_BRIDGE_MCP_URL: ""
      CHIEZO_BRIDGE_TIMEOUT: "60"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
      interval: 60s

# Chiezoのネットワークに相乗りするときだけ有効にする(上の pihole-monitor の
# networks: と対で使う)。**name は環境で変わる**ので docker network ls で確かめること
#networks:
#  chiezo:
#    external: true
#    name: chiezo_default
